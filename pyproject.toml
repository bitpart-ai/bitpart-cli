[project]
name = "bitpart"
version = "0.1.0"
description = "Bitpart CLI — game-content automation tools (TTS audio generation, metadata drift detection, ...)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# `pip install -e .` registers a real `bitpart.exe` shim in <venv>/Scripts, so
# engineers can run `bitpart tts ...` from any directory while the venv is
# active. `python -m bitpart tts ...` works equivalently without needing the
# Scripts directory on PATH (driven by bitpart/__main__.py).
[project.scripts]
bitpart = "bitpart.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bitpart*"]
